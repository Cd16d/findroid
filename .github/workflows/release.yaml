name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get Version Name
        id: get_version
        run: |
          VERSION=$(grep "const val APP_NAME =" buildSrc/src/main/kotlin/Versions.kt | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore
        id: decode_keystore
        run: |
          ENCODED="${{ secrets.KEYSTORE_BASE64 || secrets.BETA_KEYSTORE }}"
          if [ -n "$ENCODED" ]; then
            echo "$ENCODED" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
            echo "filePath=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_OUTPUT
          else
            echo "filePath=" >> $GITHUB_OUTPUT
          fi

      - name: Assemble release APKs
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BETA_KEY_PASSWORD }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          for f in app/phone/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            new_name=$(basename "$f" | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/findroid-beta-$new_name"
          done
          for f in app/tv/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            new_name=$(basename "$f" | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/findroid-tv-beta-$new_name"
          done

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || gh release list --limit 30 --exclude-drafts --json tagName --jq '([.[] | select(.tagName | startswith("v"))] | .[0].tagName) // .[0].tagName // empty' 2>/dev/null || true)

          {
            echo "Release build for \`${GITHUB_REF_NAME}\` at commit \`${GITHUB_SHA:0:7}\`."
            echo
            echo "#### 📦 Included Variants"
            echo "- **Libre:** Open-source version without proprietary libraries."
            echo "- **Proprietary:** Includes features like Chromecast support."
            echo "- **TV:** Optimized for Android TV / Leanback."
            echo

            if [ -n "$PREVIOUS_TAG" ]; then
              echo "#### 📝 Commits since \`$PREVIOUS_TAG\`"
              git log "$PREVIOUS_TAG..HEAD" --pretty=format:"* %s (%h)" --reverse
            else
              echo "#### 📝 Recent Commits"
              git log -n 30 --pretty=format:"* %s (%h)" --reverse
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Findroid Beta ${{ steps.get_version.outputs.version }} - ${{ github.ref_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
