name: Prerelease

on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  prerelease:
    name: Prerelease Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get Version Name
        id: get_version
        run: |
          VERSION=$(grep "const val APP_NAME =" buildSrc/src/main/kotlin/Versions.kt | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore file
        id: decode_keystore
        run: |
          ENCODED="${{ secrets.KEYSTORE_BASE64 || secrets.BETA_KEYSTORE }}"
          if [ -n "$ENCODED" ]; then
            echo "$ENCODED" | base64 --decode > "$GITHUB_WORKSPACE/prerelease-keystore.jks"
            echo "filePath=$GITHUB_WORKSPACE/prerelease-keystore.jks" >> $GITHUB_OUTPUT
          else
            echo "filePath=" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BETA_KEY_PASSWORD }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Phone builds -> findroid-beta-...
          for f in app/phone/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            new_name=$(basename "$f" | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/findroid-beta-$new_name"
          done
          # TV builds -> findroid-tv-beta-...
          for f in app/tv/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            new_name=$(basename "$f" | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/findroid-tv-beta-$new_name"
          done

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || gh release list --limit 30 --exclude-drafts --json tagName --jq '([.[] | select(.tagName | startswith("beta-"))] | .[0].tagName) // .[0].tagName // empty' 2>/dev/null || true)
          
          {
            echo "Automated prerelease build from branch \`beta\` at commit \`${GITHUB_SHA:0:7}\`. It may be unstable."
            echo
            echo "#### 📦 Included Variants"
            echo "- **Libre:** Open-source version without proprietary libraries."
            echo "- **Proprietary:** Includes features like Chromecast support."
            echo "- **TV:** Optimized for Android TV / Leanback."
            echo
            
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "#### 📝 Commits since \`$PREVIOUS_TAG\`"
              git log "$PREVIOUS_TAG..HEAD" --pretty=format:"* %s (%h)" --reverse
            else
              echo "#### 📝 Recent Commits"
              git log -n 30 --pretty=format:"* %s (%h)" --reverse
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta-${{ github.run_number }}
          name: "Findroid Beta ${{ steps.get_version.outputs.version }} (Beta ${{ github.run_number }})"
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
          draft: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

