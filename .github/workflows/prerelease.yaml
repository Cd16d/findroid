name: Prerelease

on:
  push:
    branches:
      - beta
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/format.yaml'
      - '.github/workflows/build.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'PRIVACY'
  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    name: Prerelease Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Determine Beta Tag
        id: beta_tag
        run: |
          LATEST_NUM=$(git tag -l "beta-*" | sed 's/beta-//' | grep -E '^[0-9]+$' | sort -n | tail -n 1)
          if [ -z "$LATEST_NUM" ]; then
            NEXT_NUM=1
            PREV_TAG=""
          else
            NEXT_NUM=$((LATEST_NUM + 1))
            PREV_TAG="beta-$LATEST_NUM"
          fi
          echo "tag_name=beta-$NEXT_NUM" >> $GITHUB_OUTPUT
          echo "beta_num=$NEXT_NUM" >> $GITHUB_OUTPUT
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get Version Name
        id: get_version
        run: |
          VERSION=$(grep "const val APP_NAME =" buildSrc/src/main/kotlin/Versions.kt | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore file
        id: decode_keystore
        run: |
          ENCODED="${{ secrets.KEYSTORE_BASE64 || secrets.BETA_KEYSTORE }}"
          if [ -n "$ENCODED" ]; then
            echo "$ENCODED" | base64 --decode > "$GITHUB_WORKSPACE/prerelease-keystore.jks"
            echo "filePath=$GITHUB_WORKSPACE/prerelease-keystore.jks" >> $GITHUB_OUTPUT
          else
            echo "filePath=" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APKs
        run: ./gradlew assembleRelease
        env:
          GITHUB_RUN_NUMBER: ${{ steps.beta_tag.outputs.beta_num }}
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BETA_KEY_PASSWORD }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Phone builds -> findroid-beta-...
          for f in app/phone/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            new_name=$(basename "$f" | sed 's/phone-//' | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/findroid-beta-$new_name"
          done
          # TV builds -> findroid-tv-beta-...
          for f in app/tv/build/outputs/apk/*/release/*.apk; do
            [ -f "$f" ] || continue
            new_name=$(basename "$f" | sed 's/tv-//' | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/findroid-tv-beta-$new_name"
          done

      - name: Generate Release Notes
        run: |
          PREVIOUS_TAG="${{ steps.beta_tag.outputs.prev_tag }}"

          {
            echo "Automated prerelease build from branch \`${GITHUB_REF_NAME}\` at commit \`${GITHUB_SHA:0:7}\`. It may be unstable."
            echo
            echo "#### 📦 Included Variants"
            echo "- **Libre:** Open-source version without proprietary libraries."
            echo "- **Proprietary:** Includes features like Chromecast support."
            echo "- **TV:** Optimized for Android TV / Leanback."
            echo

            if [ -n "$PREVIOUS_TAG" ]; then
              echo "#### 📝 Commits since \`$PREVIOUS_TAG\`"
              git log "$PREVIOUS_TAG..HEAD" --pretty=format:"* %s (%h)" --reverse
            else
              echo "#### 📝 Recent Commits"
              git log -n 30 --pretty=format:"* %s (%h)" --reverse
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.beta_tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Findroid Beta ${{ steps.get_version.outputs.version }} (Beta ${{ steps.beta_tag.outputs.beta_num }})"
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
          draft: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

