name: Beta

on:
  push:
    branches:
      - beta

jobs:
  beta:
    name: Beta Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get Version Name
        id: get_version
        run: |
          VERSION=$(grep "const val APP_NAME =" buildSrc/src/main/kotlin/Versions.kt | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore file
        uses: timheuer/base64-to-file@v2
        id: beta_keystore
        with:
          fileName: 'beta-keystore.jks'
          encodedString: ${{ secrets.BETA_KEYSTORE }}

      - name: Build Beta APKs
        run: |
          ./gradlew :app:phone:assembleLibreBeta :app:phone:assembleProprietaryBeta :app:tv:assembleLibreBeta \
            -Pandroid.injected.signing.store.file=${{ steps.beta_keystore.outputs.filePath }} \
            -Pandroid.injected.signing.store.password=${{ secrets.BETA_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.BETA_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.BETA_KEY_PASSWORD }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Phone builds -> findroid-beta-...
          for f in app/phone/build/outputs/apk/*/beta/*.apk; do
            new_name=$(basename "$f" | sed 's/app-//' | sed 's/-beta//')
            cp "$f" "artifacts/findroid-beta-$new_name"
          done
          # TV builds -> findroid-tv-beta-...
          for f in app/tv/build/outputs/apk/*/beta/*.apk; do
            new_name=$(basename "$f" | sed 's/app-//' | sed 's/-beta//')
            cp "$f" "artifacts/findroid-tv-beta-$new_name"
          done

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(gh release list --limit 30 --exclude-drafts --json tagName --jq '([.[] | select(.tagName | startswith("beta-"))] | .[0].tagName) // .[0].tagName // empty' 2>/dev/null || true)
          
          {
            echo "Automated beta build from branch \`beta\` at commit \`${GITHUB_SHA}\`. It may be unstable."
            echo
            echo "#### 📦 Included Variants"
            echo "- **Libre:** Open-source version without proprietary libraries."
            echo "- **Proprietary:** Includes features like Chromecast support."
            echo "- **TV:** Optimized for Android TV / Leanback."
            
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGES=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$GITHUB_SHA" \
                --jq '.commits[] | "* \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' 2>/dev/null || true)
              if [ -n "$CHANGES" ]; then
                echo
                echo "## Changes since $PREVIOUS_TAG"
                echo "$CHANGES"
              fi
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta-${{ github.run_number }}
          name: "Findroid ${{ steps.get_version.outputs.version }} (Beta ${{ github.run_number }})"
          body_path: release-notes.md
          prerelease: true
          draft: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

