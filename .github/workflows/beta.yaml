name: Beta

on:
  push:
    branches:
      - beta

jobs:
  beta:
    name: Beta Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore file
        uses: timheuer/base64-to-file@v2
        id: beta_keystore
        with:
          fileName: 'beta-keystore.jks'
          encodedString: ${{ secrets.BETA_KEYSTORE }}

      - name: Build Beta APKs
        run: |
          ./gradlew :app:phone:assembleLibreBeta :app:phone:assembleProprietaryBeta :app:tv:assembleLibreBeta \
            -Pandroid.injected.signing.store.file=${{ steps.beta_keystore.outputs.filePath }} \
            -Pandroid.injected.signing.store.password=${{ secrets.BETA_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.BETA_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.BETA_KEY_PASSWORD }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Phone Libre
          cp app/phone/build/outputs/apk/libre/beta/*.apk artifacts/
          # Phone Proprietary
          cp app/phone/build/outputs/apk/proprietary/beta/*.apk artifacts/
          # TV Libre
          cp app/tv/build/outputs/apk/libre/beta/*.apk artifacts/
          
          # Rename for clarity
          cd artifacts
          for f in *.apk; do
            mv "$f" "findroid-beta-${f#*-}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: "Beta Build ${{ github.run_number }}"
          prerelease: true
          draft: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
